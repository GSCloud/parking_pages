<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER KILLER | web ve výrobě</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e50914; 
            --bg-color: #0f0f0f;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(229, 9, 20, 0.08) 0%, rgba(15, 15, 15, 1) 60%);
            z-index: -1;
        }

        .container {
            max-width: 800px;
            padding: 2rem;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
            text-transform: uppercase;
        }

        h1 span {
            color: var(--primary-color);
        }

        .subtitle {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            letter-spacing: 1px;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cccccc;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .contact-value a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }

        .contact-value a:hover {
            color: var(--primary-color);
        }

        footer {
            position: absolute;
            bottom: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            .subtitle { font-size: 1.2rem; }
            .contact-info { flex-direction: column; gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <main class="container">
        <h1>MASTER <span>KILLER</span> <span class="subtitle">s.r.o.</span></h1>
        
        <p class="message">
            Tato webová prezentace se právě připravuje.<br>
            Brzy vám zde představíme nový obsah v plném rozsahu.
        </p>

        <div class="contact-info">
            <div class="contact-item">
                <span class="contact-label">E-mail</span>
                <span class="contact-value"><a href="mailto:info@masterkiller.cz">info@masterkiller.cz</a></span>
            </div>
            <div class="contact-item">
                <span class="contact-label">Telefon</span>
                <span class="contact-value"><a href="tel:+420724266137">+420 724 266 137</a></span>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 MASTER KILLER s.r.o. Všechna práva vyhrazena.
    </footer>

</body>
</html>
